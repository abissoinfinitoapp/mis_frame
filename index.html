<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a090b" />
  <title>Mis_Frame</title>
  <meta name="description" content="Mis_Frame – Gothic / Alternative Metal da Novara (area di Milano). Dark atmospheres. Powerful vocals. Modern metal identity." />
  <link rel="canonical" href="https://www.misframeofficial.com/" />
  <link rel="alternate" hreflang="it" href="https://www.misframeofficial.com/?lang=it" />
  <link rel="alternate" hreflang="en" href="https://www.misframeofficial.com/?lang=en" />
  <!-- Anteprima quando il link viene condiviso (WhatsApp, Instagram, Facebook…) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mis_Frame" />
  <meta property="og:title" content="Mis_Frame – Gothic / Alternative Metal" />
  <meta property="og:description" content="Dark atmospheres. Powerful vocals. Modern metal identity." />
  <meta property="og:url" content="https://www.misframeofficial.com/" />
  <meta property="og:image" content="https://www.misframeofficial.com/img/condivisione.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=15" />
</head>
<body class="home">

  <header class="hero">
    <img id="heroFoto" class="hero-foto" alt="" />
    <div class="hero-testo">
      <h1 id="nome" class="solo-lettori"></h1>
      <p id="sottotitolo" class="eyebrow"></p>
      <p id="luogo" class="luogo"></p>
      <p id="motto" class="motto"></p>
      <a id="heroBtn" class="btn btn-primario" href="#prossimaBox"></a>
      <nav class="lingua" aria-label="Lingua / Language">
        <a href="?lang=it" data-l="it" hreflang="it">IT</a>
        <a href="?lang=en" data-l="en" hreflang="en">EN</a>
      </nav>
    </div>
  </header>

  <main class="contenuto">

    <section id="numeriBox" class="blocco">
      <div id="numeri" class="numeri"></div>
    </section>

    <section id="galleriaBox" class="blocco galleria hidden">
      <div class="carosello-cornice">
        <div id="carosello" class="carosello"></div>
        <button class="freccia freccia-sx" data-t="fotoPrec" data-t-attr="aria-label">‹</button>
        <button class="freccia freccia-dx" data-t="fotoSucc" data-t-attr="aria-label">›</button>
      </div>
      <div id="punti" class="punti"></div>
    </section>

    <section id="ultimaBox" class="blocco in-evidenza hidden"></section>
    <section id="prossimaBox" class="blocco in-evidenza hidden"></section>

    <template id="tplEvidenza">
      <p class="eyebrow ev-etichetta"></p>
      <div class="evidenza-media"></div>
      <h2 class="ev-titolo"></h2>
      <p class="nota ev-info"></p>
      <div class="player-estratto hidden">
        <button class="play"></button>
        <div class="barra-avanz"><span></span></div>
        <span class="durata"></span>
      </div>
      <a class="btn btn-primario ev-link" target="_blank" rel="noopener"></a>
    </template>

    <section id="aboutBox" class="blocco">
      <h2 class="titolo-grande">About</h2>
      <p class="eyebrow centrata" data-nome></p>
      <div id="bio" class="bio"></div>
      <div id="generiBox" class="scheda generi">
        <p class="scheda-etichetta" data-t="generi"></p>
        <p id="generi" class="generi-lista"></p>
      </div>
    </section>

    <section id="discoBox" class="blocco">
      <h2 class="sezione" data-t="disco"></h2>
      <div id="discoList" class="disco"></div>
    </section>

    <section id="liveBox" class="blocco">
      <h2 class="titolo-grande"><span data-t="live1"></span><br /><span class="accento" data-t="live2"></span></h2>
      <p id="liveTesto" class="live-testo"></p>
      <div id="liveSchede" class="schede"></div>
      <div id="liveInfoBox" class="scheda">
        <p class="scheda-etichetta" data-t="liveInfo"></p>
        <dl id="liveInfo" class="info-live"></dl>
      </div>
    </section>

    <section id="storeBox" class="blocco">
      <h2 class="sezione" data-t="store"></h2>
      <div id="storeList" class="link-lista"></div>
    </section>

    <section id="socialBox" class="blocco">
      <h2 class="sezione" data-t="social"></h2>
      <div id="socialList" class="link-lista compatta"></div>
    </section>

    <section id="bookingBox" class="blocco booking">
      <h2 class="sezione" data-t="booking"></h2>
      <div id="bookingList" class="link-lista"></div>
    </section>

    <footer class="piede">
      <p id="copy"></p>
    </footer>

  </main>

  <script src="artist.js?v=12"></script>
  <script>
    const a = window.ARTISTA || {};
    const $ = (id) => document.getElementById(id);

    // ---------- Lingua: ?lang=… nell'indirizzo, poi la scelta salvata, poi la lingua del telefono ----------
    const LINGUE = ["it", "en"];
    let lingua = new URLSearchParams(location.search).get("lang");
    if (LINGUE.includes(lingua)) {
      try { localStorage.setItem("lingua", lingua); } catch (e) {}
    } else {
      try { lingua = localStorage.getItem("lingua"); } catch (e) { lingua = null; }
      if (!LINGUE.includes(lingua)) lingua = /^it\b/i.test(navigator.language || "") ? "it" : "en";
    }
    document.documentElement.lang = lingua;
    document.querySelectorAll(".lingua a").forEach((l) => {
      if (l.dataset.l === lingua) l.setAttribute("aria-current", "true");
    });

    const UI = {
      it: {
        ascoltaAnteprima: "Ascolta l'anteprima", ascolta: "Ascolta",
        ultima: "Ultima uscita", prossima: "Prossima uscita",
        inUscita: "in uscita il ", inArrivo: "in arrivo",
        completo: "Ascolta il brano completo", completoBreve: "Ascolta completo",
        estrattoDi: "Ascolta un estratto di ", anteprimaDi: "Ascolta l'anteprima di ",
        generi: "Genere e influenze", disco: "Discografia",
        live1: "Pronti per", live2: "il prossimo palco", liveInfo: "Informazioni live",
        store: "Ascolta su", social: "Segui", booking: "Booking e concerti",
        foto: "foto", fotoPrec: "Foto precedente", fotoSucc: "Foto successiva"
      },
      en: {
        ascoltaAnteprima: "Listen to the preview", ascolta: "Listen",
        ultima: "Latest release", prossima: "Coming next",
        inUscita: "out on ", inArrivo: "coming soon",
        completo: "Listen to the full track", completoBreve: "Full track",
        estrattoDi: "Play an excerpt of ", anteprimaDi: "Play the preview of ",
        generi: "Genre & influences", disco: "Discography",
        live1: "Ready for", live2: "the next stage", liveInfo: "Live information",
        store: "Listen on", social: "Follow", booking: "Booking & live",
        foto: "photo", fotoPrec: "Previous photo", fotoSucc: "Next photo"
      }
    }[lingua];

    // Testo nella lingua scelta: accetta "testo" oppure { it: "…", en: "…" }
    const t = (v) => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lingua] ?? v.it ?? "") : (v ?? "");

    document.querySelectorAll("[data-t]").forEach((el) => {
      const s = UI[el.dataset.t];
      if (el.dataset.tAttr) el.setAttribute(el.dataset.tAttr, s); else el.textContent = s;
    });
    document.querySelectorAll("[data-nome]").forEach((el) => el.textContent = a.nome || "");

    // ---------- Header ----------
    document.title = a.nome || "Artista";
    $("nome").textContent = a.nome || "";
    $("sottotitolo").textContent = t(a.sottotitolo);
    $("luogo").textContent = t(a.luogo);
    $("motto").textContent = t(a.motto);

    const foto = $("heroFoto");
    if (a.foto) {
      foto.src = a.foto;
      document.querySelector(".hero").style.setProperty("--hero-sfondo", `url("${a.foto}")`);
      foto.alt = a.nome || "";
      foto.onerror = () => foto.remove();
    } else {
      foto.remove();
    }
    if (a.sfondoPagina) {
      document.body.style.setProperty("--sfondo-pagina", `url("${a.sfondoPagina}")`);
    }

    // ---------- Numeri ----------
    const numeri = (a.numeri || []).filter((n) => n.valore);
    if (!numeri.length) $("numeriBox").remove();
    for (const n of numeri) {
      const el = document.createElement("div");
      el.className = "numero";
      el.innerHTML = `<strong></strong><span class="numero-titolo"></span><span class="nota"></span>`;
      el.children[0].textContent = n.valore;
      el.children[1].textContent = t(n.titolo);
      el.children[2].textContent = t(n.nota);
      $("numeri").appendChild(el);
    }

    // ---------- Carosello foto ----------
    (function () {
      const fotoG = (a.galleria || []).filter(Boolean);
      if (!fotoG.length) { $("galleriaBox").remove(); return; }
      $("galleriaBox").classList.remove("hidden");
      const car = $("carosello"), punti = $("punti");
      fotoG.forEach((src, i) => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = (a.nome || "") + " – " + UI.foto + " " + (i + 1);
        if (i > 0) img.loading = "lazy";
        // Le foto quadrate/orizzontali si vedono intere, le verticali riempiono la cornice
        img.onload = () => img.classList.toggle("intera", img.naturalWidth / img.naturalHeight > 0.85);
        car.appendChild(img);
        const p = document.createElement("button");
        p.setAttribute("aria-label", UI.foto + " " + (i + 1));
        p.addEventListener("click", () => { vai(i); ferma(); });
        punti.appendChild(p);
      });
      const n = fotoG.length;
      let corrente = 0;
      const vai = (i) => car.scrollTo({ left: ((i + n) % n) * car.clientWidth, behavior: "smooth" });
      const aggiorna = () => {
        corrente = Math.round(car.scrollLeft / car.clientWidth);
        [...punti.children].forEach((p, i) => p.classList.toggle("attivo", i === corrente));
      };
      car.addEventListener("scroll", aggiorna, { passive: true });
      aggiorna();
      $("galleriaBox").querySelector(".freccia-sx").onclick = () => { vai(corrente - 1); ferma(); };
      $("galleriaBox").querySelector(".freccia-dx").onclick = () => { vai(corrente + 1); ferma(); };

      // Scorre da solo finché non lo tocchi
      let timer = null;
      const ferma = () => { clearInterval(timer); timer = null; };
      car.addEventListener("pointerdown", ferma);
      car.addEventListener("touchstart", ferma, { passive: true });
      if (n > 1 && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        timer = setInterval(() => { if (!document.hidden) vai(corrente + 1); }, 4500);
      }
    })();

    // ---------- Lettore estratti: un solo brano alla volta ----------
    const lettore = new Audio();
    lettore.preload = "none";
    let attivo = null; // { box, btn, barra, durata }

    function fmt(s) {
      if (!isFinite(s)) return "";
      s = Math.round(s);
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }

    function collegaPlayer(box, src) {
      const ui = {
        box,
        btn: box.querySelector(".play"),
        barra: box.querySelector(".barra-avanz span"),
        durata: box.querySelector(".durata")
      };
      ui.btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (attivo === ui && !lettore.paused) { lettore.pause(); return; }
        if (attivo !== ui) {
          if (attivo) reimposta(attivo);
          attivo = ui;
          lettore.src = encodeURI(src);
        }
        lettore.play().catch(() => {});
      });
      return ui;
    }

    function reimposta(ui) {
      ui.box.classList.remove("in-play");
      ui.barra.style.width = "0";
    }

    lettore.addEventListener("play", () => attivo && attivo.box.classList.add("in-play"));
    lettore.addEventListener("pause", () => attivo && attivo.box.classList.remove("in-play"));
    lettore.addEventListener("ended", () => { if (attivo) reimposta(attivo); });
    lettore.addEventListener("timeupdate", () => {
      if (!attivo || !lettore.duration) return;
      attivo.barra.style.width = (lettore.currentTime / lettore.duration * 100) + "%";
      if (attivo.durata) attivo.durata.textContent = fmt(lettore.duration - lettore.currentTime);
    });

    // ---------- Ultima e prossima uscita ----------
    const uscite = (a.uscite || []).filter((u) => u.titolo);
    const prossima = a.prossima && a.prossima.titolo ? a.prossima : null;
    if (uscite[0]) mostraEvidenza($("ultimaBox"), uscite[0], false);
    if (prossima) mostraEvidenza($("prossimaBox"), prossima, true);

    const primo = prossima && prossima.anteprima ? "prossimaBox" : (uscite[0] ? "ultimaBox" : null);
    if (primo) {
      $("heroBtn").href = "#" + primo;
      $("heroBtn").textContent = primo === "prossimaBox" ? UI.ascoltaAnteprima : UI.ascolta;
    } else {
      $("heroBtn").remove();
    }

    function mostraEvidenza(box, ev, prossima) {
      box.appendChild($("tplEvidenza").content.cloneNode(true));
      const q = (s) => box.querySelector(s);
      box.classList.remove("hidden");
      q(".ev-etichetta").textContent = prossima ? UI.prossima : UI.ultima;
      q(".ev-titolo").textContent = ev.titolo;
      q(".ev-info").textContent = prossima
        ? [t(ev.tipo), ev.data ? UI.inUscita + t(ev.data) : UI.inArrivo].filter(Boolean).join(" · ")
        : [t(ev.tipo), t(ev.data) || ev.anno].filter(Boolean).join(" · ");

      const media = q(".evidenza-media");
      const img = document.createElement("img");
      img.src = ev.copertina || "";
      img.alt = ev.titolo;
      if (ev.video) {
        const v = document.createElement("video");
        v.src = ev.video;
        v.poster = ev.copertina || "";
        v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
        v.setAttribute("muted", ""); v.setAttribute("playsinline", "");
        v.setAttribute("aria-label", ev.titolo);
        v.onerror = () => v.replaceWith(img);
        media.appendChild(v);
      } else {
        media.appendChild(img);
      }

      const audioEv = prossima ? ev.anteprima : ev.estratto;
      if (audioEv) {
        const pl = q(".player-estratto");
        pl.classList.remove("hidden");
        pl.querySelector(".play").setAttribute("aria-label",
          (prossima ? UI.anteprimaDi : UI.estrattoDi) + ev.titolo);
        collegaPlayer(pl, audioEv);
      }

      const link = q(".ev-link");
      if (ev.link) {
        link.href = ev.link;
        link.textContent = prossima ? (t(ev.linkTesto) || "Pre-save") : UI.completo;
      } else {
        link.remove();
      }
    }

    // ---------- About ----------
    for (const par of [].concat(t(a.bio) || [])) {
      const p = document.createElement("p");
      p.textContent = par;
      $("bio").appendChild(p);
    }
    if (a.generi && a.generi.length) $("generi").textContent = [].concat(t(a.generi)).join("  |  ");
    else $("generiBox").remove();

    // ---------- Discografia (con estratti) ----------
    if (!uscite.length) $("discoBox").remove();
    for (const u of uscite) {
      const el = document.createElement("div");
      el.className = "disco-voce";
      el.innerHTML = `
        <div class="disco-cover">
          <img loading="lazy" alt="" />
          <button class="play" aria-label=""></button>
          <div class="barra-avanz"><span></span></div>
        </div>
        <strong></strong><span class="nota"></span>`;
      el.querySelector("img").src = u.copertina || "";
      el.querySelector("img").alt = u.titolo;
      el.querySelector("strong").textContent = u.titolo;
      el.querySelector(".nota").textContent = [t(u.tipo), u.anno].filter(Boolean).join(" · ");

      if (u.estratto) {
        el.querySelector(".play").setAttribute("aria-label", UI.estrattoDi + u.titolo);
        collegaPlayer(el.querySelector(".disco-cover"), u.estratto);
      } else {
        el.querySelector(".play").remove();
        el.querySelector(".barra-avanz").remove();
      }

      if (u.link) {
        const l = document.createElement("a");
        l.href = u.link; l.target = "_blank"; l.rel = "noopener";
        l.className = "disco-link";
        l.textContent = UI.completoBreve + " ↗";
        el.appendChild(l);
      }
      $("discoList").appendChild(el);
    }

    // ---------- Live ----------
    const live = a.live || {};
    if (!live.testo && !(live.schede || []).length) {
      $("liveBox").remove();
    } else {
      $("liveTesto").textContent = t(live.testo);
      for (const s of live.schede || []) {
        const el = document.createElement("div");
        el.className = "scheda";
        el.innerHTML = `<h3></h3><p></p>`;
        el.children[0].textContent = t(s.titolo);
        el.children[1].textContent = t(s.testo);
        $("liveSchede").appendChild(el);
      }
      if ((live.info || []).length) {
        for (const i of live.info) {
          const d = document.createElement("div");
          d.innerHTML = `<dt></dt><dd></dd>`;
          d.children[0].textContent = t(i.etichetta);
          d.children[1].textContent = t(i.valore);
          $("liveInfo").appendChild(d);
        }
      } else {
        $("liveInfoBox").remove();
      }
    }

    // ---------- Link ----------
    function riempi(listaId, boxId, voci) {
      const attive = (voci || []).filter((v) => v.url);
      if (!attive.length) { $(boxId).remove(); return; }
      for (const v of attive) {
        const el = document.createElement("a");
        el.className = "link-voce";
        el.href = v.url;
        el.target = "_blank";
        el.rel = "noopener";
        el.innerHTML = `<span></span><span aria-hidden="true">↗</span>`;
        el.firstChild.textContent = t(v.nome);
        $(listaId).appendChild(el);
      }
    }
    riempi("storeList", "storeBox", a.store);
    riempi("socialList", "socialBox", a.social);

    // ---------- Booking ----------
    const booking = [];
    if (a.contatti) booking.push({ href: "mailto:" + a.contatti, testo: a.contatti, icona: "✉" });
    if (a.telefono) booking.push({ href: "tel:" + a.telefono.replace(/[^\d+]/g, ""), testo: a.telefono, icona: "☎" });
    if (!booking.length) $("bookingBox").remove();
    for (const b of booking) {
      const el = document.createElement("a");
      el.className = "link-voce";
      el.href = b.href;
      el.innerHTML = `<span></span><span aria-hidden="true"></span>`;
      el.children[0].textContent = b.testo;
      el.children[1].textContent = b.icona;
      $("bookingList").appendChild(el);
    }

    $("copy").textContent = `© ${new Date().getFullYear()} ${a.nome || ""}`;
  </script>
</body>
</html>
